<style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #000;
    }

    .image-container {
        position: relative;
        width: 800px; /* Ensure it matches your image dimensions */
        height: 800px; /* Ensure it matches your image dimensions */
        overflow: hidden;
    }

    .image-container img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ensures both images fit perfectly inside the container */
        animation: morph 10s infinite;
    }

    /* Morphing animation */
    @keyframes morph {
        0%, 100% {
            opacity: 1;
        }
        50% {
            opacity: 0;
        }
    }

    /* Delay the second image's animation */
    .image-container img:nth-child(2) {
        animation-delay: 5s;
    }
</style>
