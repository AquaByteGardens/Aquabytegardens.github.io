<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Morphing</title>
    <style>
        .image-container img {
            width: 100%;
            height: auto;
            animation: morph 10s infinite;
        }

        @keyframes morph {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .image-container img:nth-child(2) {
            animation-delay: 5s;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="https://aquabytegardens.github.io/image1.jpg" alt="Image 1">
        <img src="https://aquabytegardens.github.io/image2.jpg" alt="Image 2">
    </div>
</body>
</html>
