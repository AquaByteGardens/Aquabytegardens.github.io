<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Morphing</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }

        .image-container {
            position: relative;
            width: 800px;
            height: 800px;
            overflow: hidden;
        }

        .image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: morph 10s infinite;
        }

        @keyframes morph {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .image-container img:nth-child(2) {
            animation-delay: 5s;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="https://aquabytegardens.github.io/image1.jpg" alt="Image 1">
        <img src="https://aquabytegardens.github.io/image2.jpg" alt="Image 2">
    </div>
</body>
</html>
